<!doctype html><meta charset=utf-8><body style="max-width:760px;margin:30px auto;font-family:sans-serif">
<div class="hz-banner" aria-label="Animated illustration of a glacial lake outburst flood moving down a Himalayan valley">
  <canvas id="hz-canvas"></canvas>
  <div class="hz-label hz-tl">GLOF propagation &middot; flow depth</div>
  <div class="hz-label hz-tr" id="hz-clock">t = 00:00 h</div>
  <div class="hz-legend"><span>0 m</span><i></i><span>12 m</span></div>
</div>
<div class="hz-stripes" id="hz-stripes" title="Warming stripes (illustrative)"></div>
<div class="hz-caption">Illustrative flood run and warming stripes &middot; not real model output</div>

<style>
.hz-banner { position: relative; height: 230px; border-radius: 8px 8px 0 0; overflow: hidden; background: #0b1424; margin: 0 0 0 28px; }
.hz-banner canvas { width: 100%; height: 100%; display: block; }
.hz-label { position: absolute; top: 10px; font: 600 11px/1 system-ui, sans-serif; letter-spacing: 1.5px; text-transform: uppercase; color: rgba(255,255,255,0.75); }
.hz-tl { left: 14px; } .hz-tr { right: 14px; text-transform: none; font-variant-numeric: tabular-nums; }
.hz-legend { position: absolute; right: 14px; bottom: 10px; display: flex; align-items: center; gap: 6px; font: 10px system-ui, sans-serif; color: rgba(255,255,255,0.7); }
.hz-legend i { width: 80px; height: 6px; border-radius: 3px; background: linear-gradient(90deg,#9be7ff,#2a7ae2,#1b2f8f,#4a148c); }
.hz-stripes { display: flex; height: 14px; margin-left: 28px; border-radius: 0 0 8px 8px; overflow: hidden; }
.hz-stripes span { flex: 1; transform: scaleY(0); transform-origin: bottom; animation: hzGrow 0.5s ease forwards; }
@keyframes hzGrow { to { transform: scaleY(1); } }
.hz-caption { margin: 4px 0 1.4em 28px; font-size: 0.72em; opacity: 0.5; color: var(--global-text-color); }
@media (max-width: 600px) { .hz-banner, .hz-stripes, .hz-caption { margin-left: 0; } .hz-banner { height: 180px; } }
@media (prefers-reduced-motion: reduce) { .hz-stripes span { animation: none; transform: none; } }
</style>

<script>
(function () {
  var c = document.getElementById('hz-canvas'); if (!c) return;
  var ctx = c.getContext('2d'), W, H, dpr = window.devicePixelRatio || 1;
  var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size() { W = c.clientWidth; H = c.clientHeight; c.width = W * dpr; c.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); }
  size(); window.addEventListener('resize', size);

  // ridge profile helper
  function ridge(y0, amp, seed, f) { var p = []; for (var x = 0; x <= 1.0001; x += 0.01) { p.push([x, y0 - amp * (0.55 * Math.abs(Math.sin(x * f + seed)) + 0.3 * Math.abs(Math.sin(x * f * 2.3 + seed * 2)) + 0.15 * Math.sin(x * 17 + seed))]); } return p; }
  var far = ridge(0.55, 0.38, 1.3, 5), mid = ridge(0.72, 0.3, 2.1, 7);
  // river path from lake (upper left) to valley mouth (lower right)
  function riverPt(s) { return [0.14 + 0.82 * s + 0.05 * Math.sin(s * 9), 0.47 + 0.43 * s + 0.04 * Math.sin(s * 6 + 1)]; }
  var stars = []; for (var i = 0; i < 40; i++) stars.push([Math.random(), Math.random() * 0.45, Math.random()]);

  function fill(pts, col) { ctx.beginPath(); ctx.moveTo(0, H); pts.forEach(function (p) { ctx.lineTo(p[0] * W, p[1] * H); }); ctx.lineTo(W, H); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); }
  function depthCol(d) { // d 0..1
    var stops = [[155,231,255],[42,122,226],[27,47,143],[74,20,140]], t = Math.max(0, Math.min(0.999, d)) * 3, i = Math.floor(t), f = t - i, a = stops[i], b = stops[i + 1];
    return 'rgb(' + [0,1,2].map(function (k) { return Math.round(a[k] + (b[k] - a[k]) * f); }).join(',') + ')';
  }

  var T = 9000, start = performance.now();
  function frame(now) {
    var ph = still ? 0.55 : ((now - start) % T) / T;
    ctx.clearRect(0, 0, W, H);
    var g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0b1424'); g.addColorStop(1, '#1d2d4a'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    stars.forEach(function (s) { ctx.fillStyle = 'rgba(255,255,255,' + (0.25 + 0.5 * Math.abs(Math.sin(now / 900 + s[2] * 6))) + ')'; ctx.fillRect(s[0] * W, s[1] * H, 1.2, 1.2); });
    fill(far, '#2b3d5c');
    // snow caps: ridge clipped above snowline
    ctx.save(); ctx.beginPath(); ctx.moveTo(0, H); far.forEach(function (p) { ctx.lineTo(p[0] * W, p[1] * H); }); ctx.lineTo(W, H); ctx.closePath(); ctx.clip();
    var sg = ctx.createLinearGradient(0, 0.12 * H, 0, 0.32 * H); sg.addColorStop(0, 'rgba(235,245,255,0.9)'); sg.addColorStop(1, 'rgba(235,245,255,0)');
    ctx.fillStyle = sg; ctx.fillRect(0, 0, W, 0.32 * H); ctx.restore();
    fill(mid, '#3a4f6e');
    fill([[0, 0.86], [0.3, 0.8], [0.6, 0.88], [1, 0.82]], '#24344f');

    // glacial lake, drains during the burst
    var drain = Math.min(1, Math.max(0, (ph - 0.05) / 0.35));
    ctx.beginPath(); ctx.ellipse(0.12 * W, 0.46 * H, 0.06 * W * (1 - 0.45 * drain), 0.035 * H * (1 - 0.4 * drain), 0, 0, Math.PI * 2);
    ctx.fillStyle = '#7fd3f5'; ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.8)'; ctx.font = '10px system-ui'; ctx.fillText('glacial lake', 0.06 * W, 0.4 * H);

    // channel
    ctx.lineCap = 'round'; ctx.strokeStyle = 'rgba(160,190,220,0.25)'; ctx.lineWidth = 3;
    ctx.beginPath(); for (var s = 0; s <= 1; s += 0.01) { var p = riverPt(s); s ? ctx.lineTo(p[0] * W, p[1] * H) : ctx.moveTo(p[0] * W, p[1] * H); } ctx.stroke();

    // flood wave: front position with attenuating peak depth
    var front = Math.min(1, Math.max(0, (ph - 0.05) / 0.7)), fade = ph > 0.85 ? 1 - (ph - 0.85) / 0.15 : 1;
    for (var s2 = 0; s2 < front; s2 += 0.006) {
      var behind = front - s2, d = Math.exp(-behind * 2.5) * (1 - 0.5 * s2) + 0.15 * (1 - s2);
      var q = riverPt(s2); ctx.globalAlpha = 0.9 * fade;
      ctx.fillStyle = depthCol(1 - d); ctx.beginPath(); ctx.arc(q[0] * W, q[1] * H, 1.5 + 6 * d, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // village markers
    [0.5, 0.82].forEach(function (s3) { var v = riverPt(s3); var hit = front > s3 && fade > 0.3; ctx.fillStyle = hit ? '#ff6b5b' : '#ffd27a'; ctx.fillRect(v[0] * W + 12, v[1] * H - 12, 6, 6); });

    var hrs = Math.floor(front * 3), min = Math.floor((front * 180) % 60);
    document.getElementById('hz-clock').textContent = 't = ' + String(hrs).padStart(2, '0') + ':' + String(min).padStart(2, '0') + ' h';
    if (!still) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // warming stripes, illustrative trend plus noise
  var box = document.getElementById('hz-stripes'), n = 60, seed = 7;
  function rnd() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
  for (var k = 0; k < n; k++) {
    var v = -1 + 2.2 * (k / n) + (rnd() - 0.5) * 0.7; v = Math.max(-1, Math.min(1, v));
    var pal = [[8,48,107],[33,102,172],[67,147,195],[146,197,222],[209,229,240],[253,219,199],[244,165,130],[214,96,77],[178,24,43],[103,0,13]];
    var idx = Math.round((v + 1) / 2 * 9), c3 = pal[idx];
    var sp = document.createElement('span'); sp.style.background = 'rgb(' + c3.join(',') + ')';
    sp.style.animationDelay = (k * 0.02) + 's'; box.appendChild(sp);
  }
})();
</script>
